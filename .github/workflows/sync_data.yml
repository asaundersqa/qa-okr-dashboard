name: Sync Google Sheets Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Fetch Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<EOF
          import os
          import json
          import csv
          from googleapiclient.discovery import build
          from google.oauth2 import service_account

          try:
              # 1. Authenticate
              info = json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_KEY'])
              creds = service_account.Credentials.from_service_account_info(info)
              service = build('sheets', 'v4', credentials=creds)

              SPREADSHEET_ID = '1x5C-L1rMF94EdWPNZNzPHkxiENil8ZcOywiWAcVYjFQ'

              # 2. Get the name of the FIRST tab automatically
              sheet_metadata = service.spreadsheets().get(spreadsheetId=SPREADSHEET_ID).execute()
              first_sheet_name = sheet_metadata['sheets'][0]['properties']['title']
              print(f"Loading data from tab: {first_sheet_name}")

              # 3. Pull the data from that tab (Columns A through E)
              range_name = f"'{first_sheet_name}'!A:E"
              result = service.spreadsheets().values().get(spreadsheetId=SPREADSHEET_ID, range=range_name).execute()
              values = result.get('values', [])

              # 4. Save to CSV
              if not values:
                  print("No data found.")
                  exit(1)
                  
              with open('manual_prs.csv', 'w', newline='') as f:
                  writer = csv.writer(f)
                  writer.writerows(values)
              print("File saved successfully.")

          except Exception as e:
              print(f"Error occurred: {e}")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "DataSyncBot"
          git config --global user.email "actions@github.com"
          git add manual_prs.csv
          git commit -m "Auto-update data via Python" || echo "No changes"
          git push
