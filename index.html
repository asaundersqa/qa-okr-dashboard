<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QA OKR Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
  .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  .dropdown-content { display: none; position: absolute; width: 100%; margin-top: 4px; background: #1e293b; border: 1px solid #334155; rounded-lg: 0.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); max-height: 16rem; overflow-y: auto; padding: 0.5rem; }
  .dropdown-content.show { display: block; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<div class="flex min-h-screen">

  <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col no-print z-50">
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-white font-bold text-lg leading-tight">QA Command</h1>
        <p class="text-xs text-slate-500">OKR Dashboard</p>
      </div>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Time Period</label>
        <select id="periodSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
          <option value="2">2 Weeks</option>
          <option value="8" selected>8 Weeks</option>
          <option value="12">12 Weeks</option>
        </select>
      </div>

      <div class="relative z-[60]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Groups</label>
        <button id="groupBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center hover:border-slate-600">
          <span id="groupBtnText">All Groups</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="groupDropdown" class="dropdown-content custom-scrollbar">
           <div id="groupOptions"></div>
        </div>
      </div>

      <div class="relative z-[55]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Teams</label>
        <button id="teamBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center hover:border-slate-600">
          <span id="teamBtnText">All Teams</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="teamDropdown" class="dropdown-content custom-scrollbar">
           <div id="teamOptions"></div>
        </div>
      </div>
    </div>

    <div class="mt-auto pt-6 border-t border-slate-800">
      <button id="exportPdfBtn" class="w-full mb-4 bg-gradient-to-br from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium text-sm rounded-lg px-3 py-2.5 flex items-center justify-center gap-2 transition-colors">
        PDF Export
      </button>
      <div class="text-xs text-slate-500">
        <p class="flex items-center gap-2"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span>System operational</p>
        <p class="mt-2">Q4 2026 · Snapshot</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto" id="mainContent">
    <header class="mb-10 flex justify-between items-end">
      <div>
        <p class="text-sm text-cyan-400 font-medium mb-1" id="scopeBadge">All Groups · All Teams</p>
        <h2 class="text-3xl font-bold text-white">OKR Command Center</h2>
        <p class="text-slate-400 mt-1">Real-time view of QA objectives</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-500 uppercase tracking-wider">Aggregated</p>
        <p class="text-2xl font-bold text-white" id="teamCount">-- Teams</p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6" id="kpiGrid"></div>

    <div class="mt-10 bg-slate-900 border border-slate-800 rounded-xl p-6">
      <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Team Breakdown</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr id="tableHeader" class="text-left text-slate-500 border-b border-slate-800"></tr>
          </thead>
          <tbody id="teamTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const groupsData = {
  "Data Consistency": ["DC1", "DC2", "DC3"],
  "AI": ["AI1", "AI2", "AI3", "AI4", "AI5", "AI6"],
  "Process": ["Process 1", "Process 2", "Process 3", "Enterprise Architecture"],
  "Project Spillover": ["Intelligent Feature Adoption", "License Request/Grants", "New Enterprise User"],
  "Growth": ["Growth"],
  "Planning": ["Planning 1", "Planning 2"],
  "Cloud": ["Cloud 1", "Cloud 2"],
  "Intelligent Interface": ["Intelligent Interface 1", "Intelligent Interface 2", "Intelligent Interface 3", "Intelligent Interface 4", "UFO"],
  "Core": ["Papercuts", "Core Support", "Change Management", "Templates"],
  "Accelerator Platform": ["Accelerator Platform 1", "Accelerator Platform 2"]
};

let dashboardData = {}; 
let selectedGroups = [];
let selectedTeams = [];
const allTeamsList = Object.values(groupsData).flat();
const teamToGroup = {};
Object.entries(groupsData).forEach(([g, ts]) => ts.forEach(t => teamToGroup[t] = g));

const kpis = [
  { key: 'bugTriage', name: 'Bug Triage', unit: 'h', goal: 72, type: 'lower', agg: 'avg', desc: 'Avg time to triage' },
  { key: 'manualPRs', name: 'Manual PRs', unit: '%', goal: 20, type: 'lower', agg: 'avg', desc: 'Manually tested PRs' },
  { key: 'shiftLeft', name: 'Shift Left', unit: '', goal: 100, type: 'higher', agg: 'sum', desc: 'Total Items (Combined)' },
  { key: 'qaTools', name: 'QA Tools', unit: '', goal: 14, type: 'higher', agg: 'sum', desc: 'Total Adoptions (Combined)' }
];

// --- MULTI-SELECT DROPDOWN LOGIC ---
function initMultiSelect(btnId, dropdownId, optionsId, isGroup = true) {
  const btn = document.getElementById(btnId);
  const dropdown = document.getElementById(dropdownId);
  const optionsDiv = document.getElementById(optionsId);

  btn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.dropdown-content').forEach(d => { if(d !== dropdown) d.classList.remove('show'); });
    dropdown.classList.toggle('show');
  };

  dropdown.onclick = (e) => e.stopPropagation();

  const renderOptions = (items) => {
    optionsDiv.innerHTML = items.map(item => `
      <label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm">
        <input type="checkbox" value="${item}" class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">
        ${item}
      </label>
    `).join('');

    optionsDiv.querySelectorAll('input').forEach(input => {
      input.onchange = () => {
        if (isGroup) {
          selectedGroups = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value);
          updateTeamOptions();
        } else {
          selectedTeams = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value);
        }
        updateButtonText();
        refresh();
      };
    });
  };

  if (isGroup) renderOptions(Object.keys(groupsData));
  else renderOptions(allTeamsList);
}

function updateTeamOptions() {
  const teamOptionsDiv = document.getElementById('teamOptions');
  const teamsToDisplay = selectedGroups.length === 0 ? allTeamsList : selectedGroups.flatMap(g => groupsData[g]);
  
  teamOptionsDiv.innerHTML = teamsToDisplay.map(team => `
    <label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm">
      <input type="checkbox" value="${team}" ${selectedTeams.includes(team) ? 'checked' : ''} class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">
      ${team}
    </label>
  `).join('');

  teamOptionsDiv.querySelectorAll('input').forEach(input => {
    input.onchange = () => {
      selectedTeams = Array.from(teamOptionsDiv.querySelectorAll('input:checked')).map(i => i.value);
      updateButtonText();
      refresh();
    };
  });
}

function updateButtonText() {
  document.getElementById('groupBtnText').innerText = selectedGroups.length ? `${selectedGroups.length} Groups` : "All Groups";
  document.getElementById('teamBtnText').innerText = selectedTeams.length ? `${selectedTeams.length} Teams` : "All Teams";
}

window.onclick = () => document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));

// --- DATA FETCHING & PROCESSING ---
async function fetchCSVData() {
    try {
        const [resPR, resTriage] = await Promise.all([
            fetch('manual_prs.csv'),
            fetch('bug_triage.csv')
        ]);

        allTeamsList.forEach(t => dashboardData[t] = { bugTriage: 0, manualPRs: 0, shiftLeft: 0, qaTools: 0 });

        const prText = resPR.ok ? await resPR.text() : "";
        const triageText = resTriage.ok ? await resTriage.text() : "";
        const weeksToLookBack = parseInt(document.getElementById('periodSelect').value);

        // Process Manual PRs
        if (prText) {
            const rows = prText.split('\n').filter(r => r.trim() !== '');
            const prRaw = rows.slice(1).map(r => {
                const c = r.split(',').map(v => v.trim());
                return { week: c[0], team: c[1], manual: parseInt(c[2]) || 0, total: parseInt(c[3]) || 0 };
            });
            const targetWeeks = [...new Set(prRaw.map(d => d.week))].sort().reverse().slice(0, weeksToLookBack);
            allTeamsList.forEach(team => {
                const teamRows = prRaw.filter(d => d.team === team && targetWeeks.includes(d.week));
                if (teamRows.length > 0) {
                    const totalM = teamRows.reduce((s, r) => s + r.manual, 0);
                    const totalT = teamRows.reduce((s, r) => s + r.total, 0);
                    dashboardData[team].manualPRs = totalT > 0 ? (totalM / totalT) * 100 : 0;
                }
            });
        }

        // Process Bug Triage
        if (triageText) {
            const rows = triageText.split('\n').filter(r => r.trim() !== '');
            const trRaw = rows.slice(1).map(r => {
                const c = r.split(',').map(v => v.trim());
                return { week: c[0], team: c[1], hours: parseFloat(c[2]) || 0 };
            });
            const targetWeeks = [...new Set(trRaw.map(d => d.week))].sort().reverse().slice(0, weeksToLookBack);
            allTeamsList.forEach(team => {
                const teamRows = trRaw.filter(d => d.team === team && targetWeeks.includes(d.week));
                if (teamRows.length > 0) {
                    dashboardData[team].bugTriage = teamRows.reduce((s, r) => s + r.hours, 0) / teamRows.length;
                }
            });
        }

        refresh();
    } catch (e) { console.error(e); refresh(); }
}

function getActiveTeams() {
  if (selectedTeams.length) return selectedTeams;
  if (selectedGroups.length) return selectedGroups.flatMap(g => groupsData[g]);
  return allTeamsList;
}

function aggregate(teams, kpi) {
  const sum = teams.reduce((acc, t) => acc + (dashboardData[t] ? dashboardData[t][kpi.key] : 0), 0);
  return kpi.agg === 'sum' ? sum : (teams.length ? sum / teams.length : 0);
}

function statusFor(kpi, value) {
  return kpi.type === 'lower' ? (value <= kpi.goal ? 'on' : 'risk') : (value >= kpi.goal ? 'on' : 'risk');
}

function progressPct(kpi, value) {
  if (kpi.type === 'lower') return value === 0 ? 100 : Math.max(0, Math.min(100, (kpi.goal / value) * 100));
  return Math.max(0, Math.min(100, (value / kpi.goal) * 100));
}

function formatValue(kpi, value) {
  return `${Number.isInteger(value) ? value : value.toFixed(1)}${kpi.unit}`;
}

// --- RENDER FUNCTIONS ---
function renderKPIs() {
  const teams = getActiveTeams();
  const isAnyFilterActive = selectedTeams.length > 0 || selectedGroups.length > 0;
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = '';

  kpis.forEach(kpi => {
    if (isAnyFilterActive && (kpi.key === 'shiftLeft' || kpi.key === 'qaTools')) return;
    const val = aggregate(teams, kpi);
    const status = statusFor(kpi, val);
    const pct = progressPct(kpi, val);
    const onTrack = status === 'on';
    
    grid.innerHTML += `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 transition-all hover:border-slate-700">
        <div class="flex justify-between items-start mb-4">
          <div><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">${kpi.name}</p></div>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full ${onTrack ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'} text-xs border border-current/20">
            ${onTrack ? 'On Track' : 'At Risk'}
          </span>
        </div>
        <div class="flex items-baseline gap-2 mb-4"><span class="text-4xl font-bold text-white">${formatValue(kpi, val)}</span></div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
          <div class="progress-bar h-full ${onTrack ? 'bg-cyan-500' : 'bg-amber-500'} rounded-full" style="width: ${pct}%"></div>
        </div>
      </div>`;
  });
}

function renderTable() {
  const teams = getActiveTeams();
  const isAnyFilterActive = selectedTeams.length > 0 || selectedGroups.length > 0;
  
  document.getElementById('tableHeader').innerHTML = `
    <th class="py-3 px-2 font-medium">Team</th>
    <th class="py-3 px-2 font-medium">Group</th>
    <th class="py-3 px-2 font-medium text-center">Bug Triage</th>
    <th class="py-3 px-2 font-medium text-center">Manual PRs</th>
    ${!isAnyFilterActive ? '<th class="py-3 px-2 font-medium text-center">Shift Left</th><th class="py-3 px-2 font-medium text-center">QA Tools</th>' : ''}
  `;

  document.getElementById('teamTable').innerHTML = teams.map(t => {
    const d = dashboardData[t];
    const cell = (kpi, val) => `<td class="py-3 px-2 ${statusFor(kpi, val) === 'on' ? 'text-emerald-400' : 'text-amber-400'} text-center font-medium">${formatValue(kpi, val)}</td>`;
    return `
      <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
        <td class="py-3 px-2 text-white font-medium">${t}</td>
        <td class="py-3 px-2 text-slate-400 text-xs">${teamToGroup[t] || 'N/A'}</td>
        ${cell(kpis[0], d.bugTriage)}
        ${cell(kpis[1], d.manualPRs)}
        ${!isAnyFilterActive ? cell(kpis[2], d.shiftLeft) + cell(kpis[3], d.qaTools) : ''}
      </tr>`;
  }).join('');
}

function refresh() {
  const teams = getActiveTeams();
  document.getElementById('scopeBadge').innerText = `${selectedGroups.length ? selectedGroups.join(', ') : 'All Groups'} · ${selectedTeams.length ? selectedTeams.length + ' Teams' : 'All Teams'}`;
  document.getElementById('teamCount').innerText = `${teams.length} Teams`;
  renderKPIs(); 
  renderTable(); 
}

// --- INITIALIZATION ---
initMultiSelect('groupBtn', 'groupDropdown', 'groupOptions', true);
initMultiSelect('teamBtn', 'teamDropdown', 'teamOptions', false);
document.getElementById('periodSelect').onchange = fetchCSVData;
fetchCSVData();

exportPdfBtn.addEventListener('click', () => {
  const element = document.getElementById('mainContent');
  html2pdf().set({
    margin: 0.3, filename: 'QA-OKR-Report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, backgroundColor: '#020617' },
    jsPDF: { unit: 'in', format: 'a3', orientation: 'landscape' }
  }).from(element).save();
});
</script>
</body>
</html>
