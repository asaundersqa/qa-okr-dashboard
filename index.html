<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>

  body { font-family: 'Inter', sans-serif; }

<body class="bg-slate-950 text-slate-200 min-h-screen">

<div class="flex min-h-screen">

  <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col no-print">
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-white font-bold text-lg leading-tight">QA Command</h1>
        <p class="text-xs text-slate-500">OKR Dashboard</p>
      </div>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Time Period</label>

          <option value="2">2 Weeks</option>
          <option value="8" selected>8 Weeks</option>
          <option value="12">12 Weeks</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Group</label>
        <select id="groupSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500">
          <option value="all">All Groups</option>
          <option value="Data Consistency">Data Consistency</option>
          <option value="AI">AI</option>
          <option value="Process">Process</option>
          <option value="Growth">Growth</option>
          <option value="Planning">Planning</option>
          <option value="Cloud">Cloud</option>
          <option value="Intelligent Interface">Intelligent Interface</option>
          <option value="Project Spillover">Project Spillover</option>
          <option value="Core">Core</option>
          <option value="Accelerator Platform">Accelerator Platform</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Team</label>
        <select id="teamSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500">
          <option value="all">All Teams</option>
        </select>
      </div>
    </div>

    <div class="mt-auto pt-6 border-t border-slate-800">
      <button id="exportPdfBtn" class="w-full mb-4 bg-gradient-to-br from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium text-sm rounded-lg px-3 py-2.5 flex items-center justify-center gap-2 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/>
        </svg>
        PDF Export
      </button>
      <div class="text-xs text-slate-500">
        <p class="flex items-center gap-2">
          <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
          System operational
        </p>
        <p class="mt-2">Q4 2026 · Snapshot</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto" id="mainContent">
    <header class="mb-10 flex justify-between items-end">
      <div>
        <p class="text-sm text-cyan-400 font-medium mb-1" id="scopeBadge">All Groups · All Teams</p>
        <h2 class="text-3xl font-bold text-white">OKR Command Center</h2>
        <p class="text-slate-400 mt-1">Real-time view of QA objectives</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-500 uppercase tracking-wider">Aggregated</p>
        <p class="text-2xl font-bold text-white" id="teamCount">-- Teams</p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6" id="kpiGrid"></div>

    <div class="mt-10 bg-slate-900 border border-slate-800 rounded-xl p-6">
      <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Team Breakdown</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b border-slate-800">
              <th class="py-3 px-2 font-medium">Team</th>
              <th class="py-3 px-2 font-medium">Group</th>
              <th class="py-3 px-2 font-medium text-center">Bug Triage</th>
              <th class="py-3 px-2 font-medium text-center">Manual PRs</th>
              <th class="py-3 px-2 font-medium text-center">Shift Left</th>
              <th class="py-3 px-2 font-medium text-center">QA Tools</th>
            </tr>
          </thead>
          <tbody id="teamTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const groups = {
  "Data Consistency": ["DC1", "DC2", "DC3"],
  "AI": ["AI1", "AI2", "AI3", "AI4", "AI5", "AI6"],
  "Process": ["Process 1", "Process 2", "Process 3", "Enterprise Architecture"],
  "Project Spillover": ["Intelligent Feature Adoption", "License Request/Grants", "New Enterprise User"],
  "Growth": ["Growth"],
  "Planning": ["Planning 1", "Planning 2"],
  "Cloud": ["Cloud 1", "Cloud 2"],
  "Intelligent Interface": ["Intelligent Interface 1", "Intelligent Interface 2", "Intelligent Interface 3", "Intelligent Interface 4", "UFO"],
  "Core": ["Papercuts", "Core Support", "Change Management", "Templates"],
  "Accelerator Platform": ["Accelerator Platform 1", "Accelerator Platform 2"]
};

// State for data
let dashboardData = {}; 
const allTeamsList = Object.values(groups).flat();
const teamToGroup = {};
Object.entries(groups).forEach(([g, ts]) => ts.forEach(t => teamToGroup[t] = g));

const kpis = [
  { key: 'bugTriage', name: 'Bug Triage', unit: 'h', goal: 72, type: 'lower', agg: 'avg', desc: 'Avg time to triage' },
  { key: 'manualPRs', name: 'Manual PRs', unit: '%', goal: 20, type: 'lower', agg: 'avg', desc: 'Manually tested PRs' },
  { key: 'shiftLeft', name: 'Shift Left', unit: '', goal: 100, type: 'higher', agg: 'sum', desc: 'Total Items (Combined)' },
  { key: 'qaTools', name: 'QA Tools', unit: '', goal: 14, type: 'higher', agg: 'sum', desc: 'Total Adoptions (Combined)' }
];

const periodSelect = document.getElementById('periodSelect');
const groupSelect = document.getElementById('groupSelect');
const teamSelect = document.getElementById('teamSelect');
const kpiGrid = document.getElementById('kpiGrid');
const scopeBadge = document.getElementById('scopeBadge');
const teamCount = document.getElementById('teamCount');
const teamTable = document.getElementById('teamTable');
const exportPdfBtn = document.getElementById('exportPdfBtn');

// FETCH AND PARSE CSV
async function fetchCSVData() {
    try {
        const response = await fetch('manual_prs.csv');
        const text = await response.text();
        const rows = text.split('\n').filter(r => r.trim() !== '');
        const headers = rows[0].split(',');
        
        // Group data by Team and calculate averages per period
        const rawData = rows.slice(1).map(row => {
            const cols = row.split(',');
            return {
                week: cols[0],
                team: cols[1],
                manual: parseInt(cols[2]),
                total: parseInt(cols[3])
            };
        });

        // Initialize dashboardData with zeros
        dashboardData = {};
        allTeamsList.forEach(t => dashboardData[t] = { bugTriage: 0, manualPRs: 0, shiftLeft: 0, qaTools: 0 });

        const weeksToLookBack = parseInt(periodSelect.value);
        const uniqueWeeks = [...new Set(rawData.map(d => d.week))].sort().reverse();
        const targetWeeks = uniqueWeeks.slice(0, weeksToLookBack);

        allTeamsList.forEach(team => {
            const teamRows = rawData.filter(d => d.team === team && targetWeeks.includes(d.week));
            if (teamRows.length > 0) {
                const totalManual = teamRows.reduce((sum, r) => sum + r.manual, 0);
                const totalPRs = teamRows.reduce((sum, r) => sum + r.total, 0);
                dashboardData[team].manualPRs = totalPRs > 0 ? (totalManual / totalPRs) * 100 : 0;
            }
        });

        refresh();
    } catch (e) {
        console.error("CSV Load Error:", e);
    }
}

function updateTeamDropdown() {
  const g = groupSelect.value;
  teamSelect.innerHTML = '<option value="all">All Teams</option>';
  const teams = g === 'all' ? allTeamsList : groups[g];
  teams.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    teamSelect.appendChild(opt);
  });
}

function getSelectedTeams() {
  const g = groupSelect.value, t = teamSelect.value;
  if (t !== 'all') return [t];
  if (g === 'all') return allTeamsList;
  return groups[g];
}

function aggregate(teams, kpi) {
  const sum = teams.reduce((acc, t) => acc + (dashboardData[t] ? dashboardData[t][kpi.key] : 0), 0);
  return kpi.agg === 'sum' ? sum : (teams.length ? sum / teams.length : 0);
}

function statusFor(kpi, value) {
  if (kpi.type === 'lower') return value <= kpi.goal ? 'on' : 'risk';
  return value >= kpi.goal ? 'on' : 'risk';
}

function progressPct(kpi, value) {
  if (kpi.type === 'lower') {
    return value === 0 ? 100 : Math.max(0, Math.min(100, (kpi.goal / value) * 100));
  }
  return Math.max(0, Math.min(100, (value / kpi.goal) * 100));
}

function formatValue(kpi, value) {
  const v = Number.isInteger(value) ? value : value.toFixed(1);
  return `${v}${kpi.unit}`;
}

function renderKPIs() {
  const teams = getSelectedTeams();
  kpiGrid.innerHTML = '';
  kpis.forEach(kpi => {
    const value = aggregate(teams, kpi);
    const status = statusFor(kpi, value);
    const pct = progressPct(kpi, value);
    const onTrack = status === 'on';
    
    const badge = onTrack
      ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-medium border border-emerald-500/20"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>On Track</span>'
      : '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-medium border border-amber-500/20"><span class="w-1.5 h-1.5 bg-amber-400 rounded-full"></span>At Risk</span>';
    
    const barColor = onTrack ? 'bg-gradient-to-r from-emerald-500 to-cyan-500' : 'bg-gradient-
