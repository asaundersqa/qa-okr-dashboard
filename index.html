<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QA OKR Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
  .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  .dropdown-content { display: none; position: absolute; width: 100%; margin-top: 4px; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); max-height: 16rem; overflow-y: auto; padding: 0.5rem; }
  .dropdown-content.show { display: block; }
  .toggle-active { background: #06b6d4; color: white; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<div class="flex min-h-screen">
  <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col no-print z-50">
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl">Q</div>
      <div>
        <h1 class="text-white font-bold text-lg leading-tight">QA Command</h1>
        <p class="text-xs text-slate-500">OKR Dashboard</p>
      </div>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Time Period</label>
        <select id="periodSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
          <option value="2">2 Weeks</option>
          <option value="8" selected>8 Weeks</option>
          <option value="12">12 Weeks</option>
        </select>
      </div>

      <div class="relative z-[60]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Groups</label>
        <button id="groupBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center hover:border-slate-600">
          <span id="groupBtnText">All Groups</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="groupDropdown" class="dropdown-content custom-scrollbar">
           <div id="groupOptions"></div>
        </div>
      </div>

      <div class="relative z-[55]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Teams</label>
        <button id="teamBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center hover:border-slate-600">
          <span id="teamBtnText">All Teams</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="teamDropdown" class="dropdown-content custom-scrollbar">
           <div id="teamOptions"></div>
        </div>
      </div>
    </div>
    <div class="mt-auto pt-6 border-t border-slate-800">
      <button id="exportPdfBtn" class="w-full bg-gradient-to-br from-cyan-500 to-blue-600 text-white font-medium text-sm rounded-lg px-3 py-2.5">PDF Export</button>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto" id="mainContent">
    <header class="mb-10 flex justify-between items-end">
      <div>
        <p class="text-sm text-cyan-400 font-medium mb-1" id="scopeBadge">All Groups · All Teams</p>
        <h2 class="text-3xl font-bold text-white">OKR Command Center</h2>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-500 uppercase tracking-wider">Aggregated</p>
        <p class="text-2xl font-bold text-white" id="teamCount">-- Teams</p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-6 mb-10" id="kpiGrid"></div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-10">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-6">Bug Triage Average (Hours)</h3>
        <div class="h-64 w-full"><canvas id="triageChart"></canvas></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-6">Manual PR Testing (%)</h3>
        <div class="h-64 w-full"><canvas id="manualChart"></canvas></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-6">Cycle Time Trend (Days)</h3>
        <div class="h-64 w-full"><canvas id="cycleChart"></canvas></div>
      </div>
    </div>

    <div class="mt-10 bg-slate-900 border border-slate-800 rounded-xl p-6">
      <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Team Breakdown</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr id="tableHeader" class="text-left text-slate-500 border-b border-slate-800"></tr></thead>
          <tbody id="teamTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const groupsData = {
  "Data Consistency": ["DC1", "DC2", "DC3"], "AI": ["AI1", "AI2", "AI3", "AI4", "AI5", "AI6"], "Process": ["Process 1", "Process 2", "Process 3", "Enterprise Architecture"], "Project Spillover": ["Intelligent Feature Adoption", "License Request/Grants", "New Enterprise User"], "Growth": ["Growth"], "Planning": ["Planning 1", "Planning 2"], "Cloud": ["Cloud 1", "Cloud 2"], "Intelligent Interface": ["Intelligent Interface 1", "Intelligent Interface 2", "Intelligent Interface 3", "Intelligent Interface 4", "UFO"], "Core": ["Papercuts", "Core Support", "Change Management", "Templates"], "Accelerator Platform": ["Accelerator Platform 1", "Accelerator Platform 2"]
};

let dashboardData = {}; 
let rawPRData = [], rawTriageData = [], rawShiftData = [], rawQAData = [];
let selectedGroups = [], selectedTeams = [];
let triageChart = null, manualChart = null, cycleChart = null;
let cycleMode = 'mean'; 

const allTeamsList = Object.values(groupsData).flat();
const teamToGroup = {};
Object.entries(groupsData).forEach(([g, ts]) => ts.forEach(t => teamToGroup[t] = g));

const kpis = [
  { key: 'bugTriage', name: 'Bug Triage', unit: 'h', goal: 72, type: 'lower', agg: 'avg' },
  { key: 'manualPRs', name: 'Manual PRs', unit: '%', goal: 20, type: 'lower', agg: 'avg' },
  { key: 'cycleTime', name: 'Cycle Time', unit: 'd', goal: 2, type: 'lower', agg: 'avg' },
  { key: 'shiftLeft', name: 'Shift Left', unit: '', goal: 100, type: 'higher', agg: 'sum' },
  { key: 'qaTools', name: 'QA Tools WAU', unit: '', goal: 24, type: 'higher', agg: 'avg' }
];

const getMean = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
const getMedian = (arr) => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid-1]+s[mid])/2;
};

function updateURL() {
  const p = new URLSearchParams();
  p.set('period', document.getElementById('periodSelect').value);
  if (selectedGroups.length) p.set('groups', selectedGroups.join(','));
  if (selectedTeams.length) p.set('teams', selectedTeams.join(','));
  window.history.replaceState({}, '', `${window.location.pathname}?${p.toString()}`);
}

function loadFiltersFromURL() {
  const p = new URLSearchParams(window.location.search);
  const period = p.get('period'); if (period) document.getElementById('periodSelect').value = period;
  const groups = p.get('groups'); if (groups) selectedGroups = groups.split(',');
  const teams = p.get('teams'); if (teams) selectedTeams = teams.split(',');
  document.querySelectorAll('#groupOptions input').forEach(i => { if (selectedGroups.includes(i.value)) i.checked = true; });
  updateTeamOptions();
  document.querySelectorAll('#teamOptions input').forEach(i => { if (selectedTeams.includes(i.value)) i.checked = true; });
  updateButtonText();
}

function initMultiSelect(btnId, dropdownId, optionsId, isGroup = true) {
  const btn = document.getElementById(btnId);
  const dropdown = document.getElementById(dropdownId);
  const optionsDiv = document.getElementById(optionsId);
  btn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.dropdown-content').forEach(d => { if(d !== dropdown) d.classList.remove('show'); });
    dropdown.classList.toggle('show');
  };
  const items = isGroup ? Object.keys(groupsData) : allTeamsList;
  optionsDiv.innerHTML = items.map(item => `<label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm"><input type="checkbox" value="${item}" class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">${item}</label>`).join('');
  optionsDiv.querySelectorAll('input').forEach(input => {
    input.onchange = () => {
      if (isGroup) { selectedGroups = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value); updateTeamOptions(); }
      else { selectedTeams = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value); }
      updateButtonText(); updateURL(); refresh();
    };
  });
}

function updateTeamOptions() {
  const div = document.getElementById('teamOptions');
  const teams = selectedGroups.length === 0 ? allTeamsList : selectedGroups.flatMap(g => groupsData[g]);
  div.innerHTML = teams.map(t => `<label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm"><input type="checkbox" value="${t}" ${selectedTeams.includes(t) ? 'checked' : ''} class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">${t}</label>`).join('');
  div.querySelectorAll('input').forEach(input => { input.onchange = () => { selectedTeams = Array.from(div.querySelectorAll('input:checked')).map(i => i.value); updateButtonText(); updateURL(); refresh(); }; });
}

function updateButtonText() {
  document.getElementById('groupBtnText').innerText = selectedGroups.length ? `${selectedGroups.length} Selected` : "All Groups";
  document.getElementById('teamBtnText').innerText = selectedTeams.length ? `${selectedTeams.length} Selected` : "All Teams";
}

window.onclick = () => document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));

async function fetchCSVData() {
    try {
        const [resPR, resTr, resSh, resQA] = await Promise.all([
            fetch('manual_prs.csv'), fetch('bug_triage.csv'), fetch('shift_left.csv'), fetch('qa_tools.csv')
        ]);
        if (resPR.ok) {
            const r = (await resPR.text()).split('\n').filter(l => l.trim() !== '');
            rawPRData = r.slice(1).map(l => { 
                const c = l.split(',').map(v => v.trim()); 
                return { week: c[0], team: c[1], manual: parseInt(c[2])||0, total: parseInt(c[3])||0, cycle: parseFloat(c[4])||0.0 }; 
            });
        }
        if (resTr.ok) {
            const r = (await resTr.text()).split('\n').filter(l => l.trim() !== '');
            rawTriageData = r.slice(1).map(l => { const c = l.split(',').map(v => v.trim()); return { week: c[0], team: c[1], hours: parseFloat(c[2])||0.0 }; });
        }
        if (resSh.ok) {
            const r = (await resSh.text()).split('\n').filter(l => l.trim() !== '');
            rawShiftData = r.slice(1).map(l => { const c = l.split(',').map(v => v.trim()); const [m,d,y] = c[1].split('/'); return { date: new Date(y,m-1,d) }; });
        }
        if (resQA.ok) {
            const r = (await resQA.text()).split('\n').filter(l => l.trim() !== '');
            rawQAData = r.slice(1).map(l => { const c = l.split(',').map(v => v.trim()); return { week: c[0], visits: parseInt(c[1])||0 }; });
        }
        refresh();
    } catch (e) { console.error(e); }
}

function refresh() {
    const activeTeams = selectedTeams.length ? selectedTeams : (selectedGroups.length ? selectedGroups.flatMap(g => groupsData[g]) : allTeamsList);
    const weeksCount = parseInt(document.getElementById('periodSelect').value);
    allTeamsList.forEach(t => dashboardData[t] = { bugTriage: 0.0, manualPRs: 0.0, cycleTime: 0.0 });

    const allWeeks = [...new Set(rawPRData.map(d => d.week))].sort().reverse();
    const targetWeeks = allWeeks.slice(0, weeksCount);

    activeTeams.forEach(team => {
        const pr = rawPRData.filter(d => d.team === team && targetWeeks.includes(d.week));
        if (pr.length > 0) { 
            const tm = pr.reduce((s,r)=>s+r.manual,0); const tt = pr.reduce((s,r)=>s+r.total,0); 
            dashboardData[team].manualPRs = tt > 0 ? (tm/tt)*100.0 : 0.0; 
            const cyRaw = pr.map(r => r.cycle);
            dashboardData[team].cycleTime = (cycleMode === 'mean' ? getMean(cyRaw) : getMedian(cyRaw)) / 24.0;
        }
        const tr = rawTriageData.filter(d => d.team === team && targetWeeks.includes(d.week));
        if (tr.length > 0) dashboardData[team].bugTriage = tr.reduce((s,r)=>s+r.hours,0.0) / tr.length;
    });

    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (weeksCount * 7));
    const shiftVal = rawShiftData.filter(i => i.date >= cutoff).length;
    const qaRows = rawQAData.filter(d => targetWeeks.includes(d.week));
    const qaVal = qaRows.length ? (qaRows.reduce((s,i)=>s+i.visits, 0) / qaRows.length) : 0.0;

    document.getElementById('teamCount').innerText = `${activeTeams.length} Teams`;
    renderKPIs(activeTeams, (shiftVal>0?shiftVal-1:0), qaVal); 
    renderTable(activeTeams); 
    updateCharts(activeTeams, targetWeeks);
}

function aggregate(teams, kpi) {
  // CRITICAL FIX: Cycle Time uses RAW POOLED PRs instead of "Average of Averages"
  if (kpi.key === 'cycleTime') {
    const weeksCount = parseInt(document.getElementById('periodSelect').value);
    const allWeeks = [...new Set(rawPRData.map(d => d.week))].sort().reverse();
    const targetWeeks = allWeeks.slice(0, weeksCount);

    const pooledCycleHours = rawPRData
      .filter(d => teams.includes(d.team) && targetWeeks.includes(d.week))
      .map(d => d.cycle);

    if (pooledCycleHours.length === 0) return 0.0;
    const resultHours = (cycleMode === 'mean') ? getMean(pooledCycleHours) : getMedian(pooledCycleHours);
    return resultHours / 24.0;
  }

  const sum = teams.reduce((acc, t) => acc + (dashboardData[t] ? parseFloat(dashboardData[t][kpi.key]) : 0.0), 0.0);
  return kpi.agg === 'sum' ? sum : (teams.length ? sum / teams.length : 0.0);
}

function statusFor(kpi, value) { return kpi.type === 'lower' ? (value <= kpi.goal ? 'on' : 'risk') : (value >= kpi.goal ? 'on' : 'risk'); }
function progressPct(kpi, value) { if (kpi.type === 'lower') return value === 0 ? 100 : Math.max(0, Math.min(100, (kpi.goal / value) * 100)); return Math.max(0, Math.min(100, (value / kpi.goal) * 100)); }

function formatValue(kpi, value) {
  const num = parseFloat(value);
  if (kpi.unit === 'd') return num.toFixed(1) + 'd';
  return (Number.isInteger(num) ? num : num.toFixed(1)) + kpi.unit;
}

function renderKPIs(teams, shiftVal, qaVal) {
  const isFiltered = selectedTeams.length > 0 || selectedGroups.length > 0;
  const grid = document.getElementById('kpiGrid'); grid.innerHTML = '';
  kpis.forEach(kpi => {
    if (isFiltered && (kpi.key === 'shiftLeft' || kpi.key === 'qaTools')) return;
    const val = kpi.key === 'shiftLeft' ? shiftVal : (kpi.key === 'qaTools' ? qaVal : aggregate(teams, kpi));
    const onTrack = statusFor(kpi, val) === 'on';
    const pct = progressPct(kpi, val);
    const hasBar = ['bugTriage', 'manualPRs', 'cycleTime'].includes(kpi.key);

    grid.innerHTML += `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 transition-all hover:border-slate-700">
        <div class="flex justify-between items-start mb-4">
          <div>
            <p class="text-xs font-semibold uppercase text-slate-500">${kpi.name}</p>
            ${kpi.key === 'cycleTime' ? `<div class="flex bg-slate-800 rounded-lg p-0.5 mt-2 no-print"><button onclick="cycleMode='mean';refresh();" class="px-2 py-0.5 text-[10px] rounded-md ${cycleMode==='mean'?'toggle-active':'text-slate-500'}">Mean</button><button onclick="cycleMode='median';refresh();" class="px-2 py-0.5 text-[10px] rounded-md ${cycleMode==='median'?'toggle-active':'text-slate-500'}">Med</button></div>` : ''}
          </div>
          <span class="inline-flex px-2 py-1 rounded-full ${onTrack ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'} text-xs border border-current/20">${onTrack ? 'On Track' : 'At Risk'}</span>
        </div>
        <p class="text-4xl font-bold text-white ${hasBar ? 'mb-4' : ''}">${formatValue(kpi, val)}</p>
        ${hasBar ? `<div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden"><div class="progress-bar h-full ${onTrack?'bg-cyan-500':'bg-amber-500'} rounded-full" style="width:${pct}%"></div></div><p class="text-xs text-slate-500 mt-2">${pct.toFixed(0)}% of target</p>` : `<p class="text-xs text-slate-500 mt-2">Goal: ${kpi.goal}${kpi.unit}</p>`}
      </div>`;
  });
}

function renderTable(teams) {
  const isFiltered = selectedTeams.length > 0 || selectedGroups.length > 0;
  document.getElementById('tableHeader').innerHTML = `<th class="py-3 px-2">Team</th><th class="py-3 px-2 text-center">Bug Triage</th><th class="py-3 px-2 text-center">Manual PRs</th><th class="py-3 px-2 text-center">Cycle Time</th>${!isFiltered?'<th class="py-3 px-2 text-center">Shift Left</th><th class="py-3 px-2 text-center">QA Tools</th>':''}`;
  document.getElementById('teamTable').innerHTML = teams.map(t => {
    const d = dashboardData[t];
    const cell = (kpi, v) => `<td class="py-3 px-2 ${statusFor(kpi, v)==='on'?'text-emerald-400':'text-amber-400'} text-center font-medium">${formatValue(kpi, v)}</td>`;
    return `<tr class="border-b border-slate-800/50 hover:bg-slate-800/30"><td class="py-3 px-2 text-white font-medium">${t}</td>${cell(kpis[0],d.bugTriage)}${cell(kpis[1],d.manualPRs)}${cell(kpis[2],d.cycleTime)}${!isFiltered?'<td class="text-center text-slate-600">--</td><td class="text-center text-slate-600">--</td>':''}</tr>`;
  }).join('');
}

function updateCharts(activeTeams, targetWeeks) {
    const chrono = [...targetWeeks].reverse();
    const tri = [], man = [], cyc = [];
    chrono.forEach(w => {
        const tRows = rawTriageData.filter(d => activeTeams.includes(d.team) && d.week === w);
        tri.push(tRows.length ? getMean(tRows.map(d=>d.hours)) : null);
        const pRows = rawPRData.filter(d => activeTeams.includes(d.team) && d.week === w);
        const tm = pRows.reduce((s,r)=>s+r.manual,0), tt = pRows.reduce((s,r)=>s+r.total,0);
        man.push(tt > 0 ? (tm/tt)*100.0 : null);
        const cVal = pRows.map(r => r.cycle);
        cyc.push(cVal.length ? (cycleMode === 'mean' ? getMean(cVal) : getMedian(cVal))/24.0 : null);
    });
    const cfg = (title, max) => ({ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }, y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' }, title: { display: true, text: title, color: '#64748b' }, min: 0, max: max } } });
    if (triageChart) triageChart.destroy(); triageChart = new Chart(document.getElementById('triageChart'), { type: 'line', data: { labels: chrono, datasets: [{ data: tri, borderColor: '#06b6d4', borderWidth: 2, tension: 0.3 }] }, options: cfg('Hours', 100) });
    if (manualChart) manualChart.destroy(); manualChart = new Chart(document.getElementById('manualChart'), { type: 'line', data: { labels: chrono, datasets: [{ data: man, borderColor: '#10b981', borderWidth: 2, tension: 0.3 }] }, options: cfg('%', 100) });
    if (cycleChart) cycleChart.destroy(); cycleChart = new Chart(document.getElementById('cycleChart'), { type: 'line', data: { labels: chrono, datasets: [{ data: cyc, borderColor: '#8b5cf6', borderWidth: 2, tension: 0.3 }] }, options: cfg('Days', 5) });
}

initMultiSelect('groupBtn', 'groupDropdown', 'groupOptions', true);
initMultiSelect('teamBtn', 'teamDropdown', 'teamOptions', false);
document.getElementById('periodSelect').onchange = () => { updateURL(); fetchCSVData(); };
loadFiltersFromURL();
fetchCSVData();

exportPdfBtn.addEventListener('click', () => {
  const element = document.getElementById('mainContent');
  html2pdf().set({ margin: 0.3, filename: 'QA-Report.pdf', html2canvas: { scale: 2, backgroundColor: '#020617' }, jsPDF: { unit: 'in', format: 'a3', orientation: 'landscape' } }).from(element).save();
});
</script>
</body>
</html>
