<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QA OKR Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; background-color: #020617; }
  .progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  .dropdown-content { display: none; position: absolute; width: 100%; margin-top: 4px; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); max-height: 16rem; overflow-y: auto; padding: 0.5rem; }
  .dropdown-content.show { display: block; }
  .toggle-active { background: #06b6d4; color: white; }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="flex min-h-screen">
  <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col no-print z-50">
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl">Q</div>
      <div>
        <h1 class="text-white font-bold text-lg leading-tight">QA Command</h1>
        <p class="text-xs text-slate-500">OKR Dashboard</p>
      </div>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Time Period</label>
        <select id="periodSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none">
          <option value="2">2 Weeks</option>
          <option value="8" selected>8 Weeks</option>
          <option value="12">12 Weeks</option>
        </select>
      </div>

      <div class="relative z-[60]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Groups</label>
        <button id="groupBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center">
          <span id="groupBtnText">All Groups</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="groupDropdown" class="dropdown-content custom-scrollbar">
           <div id="groupOptions"></div>
        </div>
      </div>

      <div class="relative z-[55]">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Teams</label>
        <button id="teamBtn" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-3 py-2.5 text-sm text-left flex justify-between items-center">
          <span id="teamBtnText">All Teams</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="teamDropdown" class="dropdown-content custom-scrollbar">
           <div id="teamOptions"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto" id="mainContent">
    <header class="mb-10 flex justify-between items-end">
      <div>
        <p class="text-sm text-cyan-400 font-medium mb-1" id="scopeBadge">All Groups · All Teams</p>
        <h2 class="text-3xl font-bold text-white">OKR Command Center</h2>
      </div>
      <div class="text-right">
        <p class="text-2xl font-bold text-white" id="teamCount">-- Teams</p>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-6 mb-10" id="kpiGrid"></div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-10">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase text-slate-400 mb-6">Bug Triage Average (Hours)</h3>
        <div class="h-64 w-full"><canvas id="triageChart"></canvas></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase text-slate-400 mb-6">Manual PR Testing (%)</h3>
        <div class="h-64 w-full"><canvas id="manualChart"></canvas></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <h3 class="text-sm font-semibold uppercase text-slate-400 mb-6">Cycle Time Trend (Days)</h3>
        <div class="h-64 w-full"><canvas id="cycleChart"></canvas></div>
      </div>
    </div>

    <div class="mt-10 bg-slate-900 border border-slate-800 rounded-xl p-6">
      <h3 class="text-sm font-semibold uppercase text-slate-400 mb-4">Team Breakdown</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr id="tableHeader" class="text-left text-slate-500 border-b border-slate-800"></tr></thead>
          <tbody id="teamTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
// --- CONFIG ---
const groupsData = {
  "Data Consistency": ["DC1", "DC2", "DC3"], "AI": ["AI1", "AI2", "AI3", "AI4", "AI5", "AI6"], "Process": ["Process 1", "Process 2", "Process 3", "Enterprise Architecture"], "Project Spillover": ["Intelligent Feature Adoption", "License Request/Grants", "New Enterprise User"], "Growth": ["Growth"], "Planning": ["Planning 1", "Planning 2"], "Cloud": ["Cloud 1", "Cloud 2"], "Intelligent Interface": ["Intelligent Interface 1", "Intelligent Interface 2", "Intelligent Interface 3", "Intelligent Interface 4", "UFO"], "Core": ["Papercuts", "Core Support", "Change Management", "Templates"], "Accelerator Platform": ["Accelerator Platform 1", "Accelerator Platform 2"]
};

let rawPRData = [], rawTriageData = [], rawShiftData = [], rawQAData = [];
let selectedGroups = [], selectedTeams = [];
let cycleMode = 'mean'; 
let triageChart, manualChart, cycleChart;

const allTeamsList = Object.values(groupsData).flat();
const kpis = [
  { key: 'bugTriage', name: 'Bug Triage', unit: 'h', goal: 72, type: 'lower' },
  { key: 'manualPRs', name: 'Manual PRs', unit: '%', goal: 20, type: 'lower' },
  { key: 'cycleTime', name: 'Cycle Time', unit: 'd', goal: 2, type: 'lower' },
  { key: 'shiftLeft', name: 'Shift Left', unit: '', goal: 100, type: 'higher' },
  { key: 'qaTools', name: 'QA Tools WAU', unit: '', goal: 24, type: 'higher' }
];

// --- MATH ---
const getMean = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0.0;
const getMedian = (arr) => {
  if (!arr.length) return 0.0;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid-1]+s[mid])/2.0;
};

// --- DATA ---
async function fetchCSVData() {
    try {
        const bust = new Date().getTime();
        const [resPR, resTr, resSh, resQA] = await Promise.all([
            fetch(`manual_prs.csv?v=${bust}`), fetch(`bug_triage.csv?v=${bust}`), 
            fetch(`shift_left.csv?v=${bust}`), fetch(`qa_tools.csv?v=${bust}`)
        ]);
        
        if (resPR.ok) {
            const r = (await resPR.text()).split('\n').filter(l => l.trim().length > 5);
            rawPRData = r.slice(1).map(l => { 
                const c = l.split(',').map(v => v.trim()); 
                return { week: c[0], team: c[1], manual: parseFloat(c[2])||0, total: parseFloat(c[3])||0, cycle: parseFloat(c[5])||0 }; 
            });
            console.log("DEBUG: First row cycle hours:", rawPRData[0].cycle);
        }
        // Simplified others for brevity
        if (resTr.ok) {
            const r = (await resTr.text()).split('\n').filter(l => l.trim().length > 5);
            rawTriageData = r.slice(1).map(l => { const c = l.split(','); return { week: c[0], team: c[1], hours: parseFloat(c[2])||0 }; });
        }
        if (resSh.ok) {
            const r = (await resSh.text()).split('\n').filter(l => l.trim().length > 5);
            rawShiftData = r.slice(1).map(l => { const c = l.split(','); const p = c[1].split('/'); return { date: new Date(p[2], p[0]-1, p[1]) }; });
        }
        if (resQA.ok) {
            const r = (await resQA.text()).split('\n').filter(l => l.trim().length > 5);
            rawQAData = r.slice(1).map(l => { const c = l.split(','); return { week: c[0], visits: parseFloat(c[1])||0 }; });
        }

        loadFiltersFromURL();
        refresh();
    } catch (e) { console.error("Data error:", e); }
}

function refresh() {
    const activeTeams = selectedTeams.length ? selectedTeams : (selectedGroups.length ? selectedGroups.flatMap(g => groupsData[g]) : allTeamsList);
    const weeksCount = parseInt(document.getElementById('periodSelect').value);
    
    const allWeeks = [...new Set(rawPRData.map(d => d.week))].sort().reverse();
    const targetWeeks = allWeeks.slice(0, weeksCount);

    document.getElementById('teamCount').innerText = `${activeTeams.length} Teams`;
    renderKPIs(activeTeams, targetWeeks); 
    renderTable(activeTeams, targetWeeks); 
    updateCharts(activeTeams, targetWeeks);
    updateHeaderLabel(weeksCount);
}

function renderKPIs(teams, weeks) {
    const grid = document.getElementById('kpiGrid'); grid.innerHTML = '';
    
    kpis.forEach(kpi => {
        let val = 0;
        if (kpi.key === 'cycleTime') {
            const pooled = rawPRData.filter(d => teams.includes(d.team) && weeks.includes(d.week)).map(d => d.cycle);
            val = pooled.length ? (cycleMode === 'mean' ? getMean(pooled) : getMedian(pooled)) / 24.0 : 0;
        } else if (kpi.key === 'manualPRs') {
            const rows = rawPRData.filter(d => teams.includes(d.team) && weeks.includes(d.week));
            const tm = rows.reduce((a,b)=>a+b.manual,0), tt = rows.reduce((a,b)=>a+b.total,0);
            val = tt > 0 ? (tm/tt)*100 : 0;
        } else if (kpi.key === 'bugTriage') {
            const hrs = rawTriageData.filter(d => teams.includes(d.team) && weeks.includes(d.week)).map(d => d.hours);
            val = getMean(hrs);
        } else if (kpi.key === 'shiftLeft') {
            const start = new Date(); start.setDate(start.getDate() - (weeks.length * 7));
            val = rawShiftData.filter(d => d.date >= start).length;
        } else {
            const q = rawQAData.filter(d => weeks.includes(d.week)).map(d => d.visits);
            val = getMean(q);
        }

        const onTrack = kpi.type === 'lower' ? (val <= kpi.goal) : (val >= kpi.goal);
        grid.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <p class="text-xs font-semibold uppercase text-slate-500 mb-2">${kpi.name}</p>
                ${kpi.key === 'cycleTime' ? `
                <div class="flex bg-slate-800 rounded-lg p-0.5 mb-4 no-print w-fit">
                    <button onclick="cycleMode='mean';refresh();" class="px-2 py-0.5 text-[10px] rounded ${cycleMode==='mean'?'toggle-active':'text-slate-500'}">Mean</button>
                    <button onclick="cycleMode='median';refresh();" class="px-2 py-0.5 text-[10px] rounded ${cycleMode==='median'?'toggle-active':'text-slate-500'}">Med</button>
                </div>` : ''}
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-white">${val.toFixed(1)}${kpi.unit}</span>
                    <span class="text-xs ${onTrack?'text-emerald-400':'text-amber-400'}">${onTrack?'On Track':'At Risk'}</span>
                </div>
            </div>`;
    });
}

function renderTable(teams, weeks) {
    document.getElementById('tableHeader').innerHTML = `<th class="py-3">Team</th><th class="text-center">Triage</th><th class="text-center">Manual %</th><th class="text-center">Cycle (d)</th>`;
    document.getElementById('teamTable').innerHTML = teams.map(t => {
        const tr = rawTriageData.filter(d => d.team === t && weeks.includes(d.week)).map(d => d.hours);
        const pr = rawPRData.filter(d => d.team === t && weeks.includes(d.week));
        const manPct = pr.reduce((a,b)=>a+b.total,0) > 0 ? (pr.reduce((a,b)=>a+b.manual,0)/pr.reduce((a,b)=>a+b.total,0))*100 : 0;
        const cyc = (cycleMode === 'mean' ? getMean(pr.map(d=>d.cycle)) : getMedian(pr.map(d=>d.cycle))) / 24.0;
        return `<tr class="border-b border-slate-800/50"><td>${t}</td><td class="text-center">${getMean(tr).toFixed(1)}h</td><td class="text-center">${manPct.toFixed(1)}%</td><td class="text-center">${cyc.toFixed(1)}d</td></tr>`;
    }).join('');
}

function updateCharts(teams, weeks) {
    const chrono = [...weeks].reverse();
    const tri = [], man = [], cyc = [];
    chrono.forEach(w => {
        const tr = rawTriageData.filter(d => teams.includes(d.team) && d.week === w).map(d => d.hours);
        tri.push(getMean(tr));
        const pr = rawPRData.filter(d => teams.includes(d.team) && d.week === w);
        man.push(pr.reduce((a,b)=>a+b.total,0) > 0 ? (pr.reduce((a,b)=>a+b.manual,0)/pr.reduce((a,b)=>a+b.total,0))*100 : 0);
        const cw = pr.map(d => d.cycle);
        cyc.push((cycleMode==='mean'?getMean(cw):getMedian(cw))/24.0);
    });
    const cfg = (t, m) => ({ responsive: true, maintainAspectRatio: false, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#1e293b'}}, y:{grid:{color:'#1e293b'}, title:{display:true, text:t}, min:0, max:m}}});
    if (triageChart) triageChart.destroy(); triageChart = new Chart(document.getElementById('triageChart'), {type:'line', data:{labels:chrono, datasets:[{data:tri, borderColor:'#06b6d4'}]}, options:cfg('Hours', 100)});
    if (manualChart) manualChart.destroy(); manualChart = new Chart(document.getElementById('manualChart'), {type:'line', data:{labels:chrono, datasets:[{data:man, borderColor:'#10b981'}]}, options:cfg('%', 100)});
    if (cycleChart) cycleChart.destroy(); cycleChart = new Chart(document.getElementById('cycleChart'), {type:'line', data:{labels:chrono, datasets:[{data:cyc, borderColor:'#8b5cf6'}]}, options:cfg('Days', 5)});
}

function updateHeaderLabel(weeks) {
    const gSel = selectedGroups.length ? selectedGroups.join(', ') : "All Groups";
    const tSel = selectedTeams.length ? selectedTeams.join(', ') : "All Teams";
    document.getElementById('scopeBadge').innerText = `${gSel} · ${tSel} · ${weeks} Weeks`;
}

// UI HELPERS
function initMultiSelect(btnId, dropdownId, optionsId, isGroup) {
  const btn = document.getElementById(btnId), dropdown = document.getElementById(dropdownId), optionsDiv = document.getElementById(optionsId);
  btn.onclick = (e) => { e.stopPropagation(); document.querySelectorAll('.dropdown-content').forEach(d => { if(d !== dropdown) d.classList.remove('show'); }); dropdown.classList.toggle('show'); };
  const items = isGroup ? Object.keys(groupsData) : allTeamsList;
  optionsDiv.innerHTML = items.map(item => `<label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm"><input type="checkbox" value="${item}" class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">${item}</label>`).join('');
  optionsDiv.querySelectorAll('input').forEach(input => {
    input.onchange = () => {
      if (isGroup) { selectedGroups = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value); updateTeamOptions(); }
      else { selectedTeams = Array.from(optionsDiv.querySelectorAll('input:checked')).map(i => i.value); }
      updateURL(); refresh();
    };
  });
}

function updateTeamOptions() {
  const div = document.getElementById('teamOptions');
  const teams = selectedGroups.length === 0 ? allTeamsList : selectedGroups.flatMap(g => groupsData[g]);
  div.innerHTML = teams.map(t => `<label class="flex items-center gap-2 p-2 hover:bg-slate-700 rounded cursor-pointer text-sm"><input type="checkbox" value="${t}" ${selectedTeams.includes(t) ? 'checked' : ''} class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500">${t}</label>`).join('');
  div.querySelectorAll('input').forEach(input => { input.onchange = () => { selectedTeams = Array.from(div.querySelectorAll('input:checked')).map(i => i.value); updateURL(); refresh(); }; });
}

function updateURL() {
  const p = new URLSearchParams();
  p.set('period', document.getElementById('periodSelect').value);
  if (selectedGroups.length) p.set('groups', selectedGroups.join(','));
  if (selectedTeams.length) p.set('teams', selectedTeams.join(','));
  window.history.replaceState({}, '', `${window.location.pathname}?${p.toString()}`);
}

function loadFiltersFromURL() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('period')) document.getElementById('periodSelect').value = p.get('period');
    if (p.get('groups')) {
        selectedGroups = p.get('groups').split(',');
        document.querySelectorAll('#groupOptions input').forEach(i => { if (selectedGroups.includes(i.value)) i.checked = true; });
        updateTeamOptions();
    }
    if (p.get('teams')) {
        selectedTeams = p.get('teams').split(',');
        document.querySelectorAll('#teamOptions input').forEach(i => { if (selectedTeams.includes(i.value)) i.checked = true; });
    }
}

window.onclick = () => document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));

// INIT
initMultiSelect('groupBtn', 'groupDropdown', 'groupOptions', true);
initMultiSelect('teamBtn', 'teamDropdown', 'teamOptions', false);
fetchCSVData();
document.getElementById('periodSelect').onchange = () => { updateURL(); refresh(); };
</script>
</body>
</html>
