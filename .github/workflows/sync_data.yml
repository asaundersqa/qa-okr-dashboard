name: Sync Google Sheets Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Fetch Data from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<EOF
          import os
          import json
          import csv
          import sys
          from googleapiclient.discovery import build
          from google.oauth2 import service_account

          try:
              # 1. Setup Authentication
              info = json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_KEY'])
              creds = service_account.Credentials.from_service_account_info(info)
              service = build('sheets', 'v4', credentials=creds)

              # --- CONFIGURATION: Define Sheet IDs here ---
              # Manual PRs Sheet ID
              PR_SHEET_ID = '1x5C-L1rMF94EdWPNZNzPHkxiENil8ZcOywiWAcVYjFQ'
              # Bug Triage Sheet ID (REPLACE THIS WITH YOUR ACTUAL ID)
              TRIAGE_SHEET_ID = 'PASTE_YOUR_TRIAGE_SHEET_ID_HERE'

              # 2. Fetch Manual PRs (First Tab)
              print("Fetching Manual PRs...")
              pr_meta = service.spreadsheets().get(spreadsheetId=PR_SHEET_ID).execute()
              pr_tab = pr_meta['sheets'][0]['properties']['title']
              pr_result = service.spreadsheets().values().get(spreadsheetId=PR_SHEET_ID, range=f"'{pr_tab}'!A:E").execute()
              with open('manual_prs.csv', 'w', newline='') as f:
                  csv.writer(f).writerows(pr_result.get('values', []))
              print("manual_prs.csv saved.")

              # 3. Fetch Bug Triage (First Tab)
              print("Fetching Bug Triage...")
              tr_meta = service.spreadsheets().get(spreadsheetId=TRIAGE_SHEET_ID).execute()
              tr_tab = tr_meta['sheets'][0]['properties']['title']
              tr_result = service.spreadsheets().values().get(spreadsheetId=TRIAGE_SHEET_ID, range=f"'{tr_tab}'!A:C").execute()
              with open('bug_triage.csv', 'w', newline='') as f:
                  csv.writer(f).writerows(tr_result.get('values', []))
              print("bug_triage.csv saved.")

          except Exception as e:
              print(f"ERROR: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "DataSyncBot"
          git config --global user.email "actions@github.com"
          git add manual_prs.csv bug_triage.csv
          git commit -m "Auto-sync all CSV data" || echo "No changes"
          git push
