name: Sync Google Sheets Data

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Fetch Data from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<EOF
          import os
          import json
          import csv
          import sys
          from googleapiclient.discovery import build
          from google.oauth2 import service_account

          try:
              # 1. Setup Authentication
              info = json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_KEY'])
              creds = service_account.Credentials.from_service_account_info(info)
              service = build('sheets', 'v4', credentials=creds)

              # --- CONFIGURATION: SHEET IDs ---
              SHEETS = {
                  'manual_prs.csv': {
                      'id': '1x5C-L1rMF94EdWPNZNzPHkxiENil8ZcOywiWAcVYjFQ',
                      'range': 'A:F'
                  },
                  'bug_triage.csv': {
                      'id': '1EhoGAzeLDdD0tCXXtBTUWp1i52cUyuUqrJEpNYueZbM',
                      'range': 'A:C'
                  },
                  'shift_left.csv': {
                      'id': '1NhA2Llpf6h_QCXFXa60DzgY7BoXgpvV9bEZCzK5moZ4',
                      'range': 'A:B'
                  },
                  'qa_tools.csv': {
                      'id': '1ViDc_-FA9J_5GW0wut9DOsRSv2Egzw_wrpWg_XY0wOw',
                      'range': 'A:B'
                  }
              }

              # 2. Loop through and fetch each sheet
              for filename, config in SHEETS.items():
                  print(f"Fetching {filename}...")
                  
                  # Get sheet metadata to find the name of the first tab
                  meta = service.spreadsheets().get(spreadsheetId=config['id']).execute()
                  tab_name = meta['sheets'][0]['properties']['title']
                  
                  # Get values
                  result = service.spreadsheets().values().get(
                      spreadsheetId=config['id'], 
                      range=f"'{tab_name}'!{config['range']}"
                  ).execute()
                  
                  values = result.get('values', [])
                  
                  # Write to CSV
                  if values:
                      with open(filename, 'w', newline='') as f:
                          writer = csv.writer(f)
                          writer.writerows(values)
                      print(f"Successfully saved {filename}")
                  else:
                      print(f"Warning: No data found for {filename}")

              print("Sync Complete.")

          except Exception as e:
              print(f"CRITICAL ERROR: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "DataSyncBot"
          git config --global user.email "actions@github.com"
          git add manual_prs.csv bug_triage.csv shift_left.csv qa_tools.csv
          git commit -m "Auto-sync all 4 OKR data sources" || echo "No changes to sync"
          git push
